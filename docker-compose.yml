services:
  subhub:
    build: .
    container_name: subhub
    ports:
      - "${PORT:-3456}:3456"
    volumes:
      - ./data:/app/src/data
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - PORT=3456
      - COOKIE_SECRET=${COOKIE_SECRET:-subhub-secret-change-me}
      - SUI_BRIDGE_URL=${SUI_BRIDGE_URL:-}
      - SUI_BRIDGE_TOKEN=${SUI_BRIDGE_TOKEN:-}
      - SUI_BRIDGES=${SUI_BRIDGES:-}
      - CHINA_PING_URL=${CHINA_PING_URL:-}
      - CHINA_PING_TOKEN=${CHINA_PING_TOKEN:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
